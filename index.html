<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 动态聚合 · 实时看板</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== 左侧固定侧边栏 ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">AI</div>
    <div class="brand-text">
      <div class="brand-title">AI 动态聚合</div>
      <div class="brand-sub">Daily AI Pulse</div>
    </div>
  </div>

  <nav id="navGroups" class="nav">
    <!-- JS 渲染 -->
  </nav>

  <div class="sidebar-footer">
    <div class="live-line">
      <span class="live-dot"></span>
      <span>实时数据来自 <a href="https://aihot.news/" target="_blank" rel="noopener">AIHOT</a></span>
    </div>
    <div class="footer-note">竞品动态实时抓取 ai-video-watch · 社区热帖每日抓取 · 榜单为本地数据</div>
  </div>
</aside>

<div class="sidebar-scrim" id="scrim"></div>

<!-- ===== 主区域 ===== -->
<div class="shell">

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <div class="topbar-title">
      <h1 id="pageTitle">加载中…</h1>
      <p id="pageDesc"></p>
    </div>

    <div class="topbar-actions">
      <label class="search" id="searchWrap">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="搜索公司 / 模型 / 产品" autocomplete="off" spellcheck="false">
        <kbd class="search-kbd">/</kbd>
      </label>
      <button class="icon-btn" id="refreshBtn" title="重新拉取数据" aria-label="刷新">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <div class="meta-strip" id="metaStrip">
    <span class="meta-item" id="metaUpdate">—</span>
    <span class="meta-sep"></span>
    <span class="meta-item" id="metaWindow">—</span>
  </div>

  <main class="content" id="contentArea">
    <!-- JS 渲染 -->
  </main>

  <footer class="page-footer">
    资讯内容与链接由 <a href="https://aihot.news/" target="_blank" rel="noopener">AIHOT</a> 提供，版权归原作者所有。
    本页为纯前端页面，不做服务端存储。
  </footer>
</div>

<button class="to-top" id="toTop" title="回到顶部" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="data.js"></script>
<!-- 社区热帖：由 scripts/fetch-community.mjs 定时抓取后写入，缺失时 app.js 会自行降级 -->
<script src="community.js"></script>
<script src="app.js"></script>
</body>
</html>
